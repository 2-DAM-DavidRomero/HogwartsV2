name: Deploy Docker a Elastic Beanstalk (Gradle)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Bajar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Java 25
      - name: Set up JDK 25
        uses:     actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle' # Cambiado de maven a gradle

      # 3. Permisos y Compilación con Gradle
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4. Login en GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Calcular nombre de imagen en minúsculas
      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 6. Construir y Subir Imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.run_number }}

      # 7. Generar archivo docker-compose.yml
      - name: Generate docker-compose.yml
        run: |
          echo "services:
            app:
              image: ${{ env.IMAGE_NAME }}:${{ github.run_number }}
              ports:
                - '80:8080'
              restart: always" > docker-compose.yml

      # 8. Desplegar en AWS Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }} # Necesario si usas cuentas de AWS Academy/Learner Lab
          region: us-east-1
          application_name: HogwartsAPI # Actualizado según tu contexto
          environment_name: HogwartsAPI-env
          version_label: "hogwarts-v-${{ github.run_number }}"
          deployment_package: docker-compose.yml